# Static-bound calibration — IMAGE-modality queries (qwen3-vl-30b).
# See static_bound_experiment.md (§3) for the SemBench<->LiteDBX mapping.
# Run protocol: isolate ONE query per --cold run; clear its cert-cache entry
# in .data_ckpt/error_certificates.yaml first; vary random_seed in
# workloads/config.yaml across trials. exp_group namespaces the data cache.
tasks:
  - name: animals_image
    exp_group: static_bound_calibration
    models: [qwen3-vl-30b]
    release_model_after_task: false
    objects:
      - workload: animals
        queries:
          - [Q7]  # SemBench Wildlife.Q1 | Target F1: 1.00
    collect:
      execution_trace:
        iterations: ALL
        features: [
          pred_eval.f1, pred_eval.TP, pred_eval.FP, pred_eval.FN,
          trans_eval.f1, L_static,
          L_rew, penalty_rew, L_obj,
          L_LOO, penalty_LOO, L_subj,
          overall_selectivity, total_size,
          features,
        ]
  - name: ecomm_image
    exp_group: static_bound_calibration
    models: [qwen3-vl-30b]
    release_model_after_task: false
    objects:
      - workload: ecomm
        queries:
          - [Q2]  # SemBench E-Comm.Q2 | Target F1: 1.00
    collect:
      execution_trace:
        iterations: ALL
        features: [
          pred_eval.f1, pred_eval.TP, pred_eval.FP, pred_eval.FN,
          trans_eval.f1, L_static,
          L_rew, penalty_rew, L_obj,
          L_LOO, penalty_LOO, L_subj,
          overall_selectivity, total_size,
          features,
        ]
  - name: medical_image
    exp_group: static_bound_calibration
    models: [qwen3-vl-30b]
    release_model_after_task: false
    objects:
      - workload: medical
        queries:
          - [Q3]  # SemBench Medical.Q2 | Target F1: 0.84
          - [Q8]  # SemBench Medical.Q3 | Target F1: 0.63
          - [Q9]  # SemBench Medical.Q4 | Target F1: 0.51
    collect:
      execution_trace:
        iterations: ALL
        features: [
          pred_eval.f1, pred_eval.TP, pred_eval.FP, pred_eval.FN,
          trans_eval.f1, L_static,
          L_rew, penalty_rew, L_obj,
          L_LOO, penalty_LOO, L_subj,
          overall_selectivity, total_size,
          features,
        ]
