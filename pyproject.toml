[project]
name = "litedbx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "instructor>=1.13.0",
    "litellm[proxy]>=1.80.11",
    "pandas>=2.3.3",
    "pillow>=12.1.1",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.1",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 80

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pylint>=4.0.6",
    "ruff>=0.15.20",
]
