parallelism: 20


timeout: 30
max_retries: 3
max_tokens: 16384
top_p: 1.0
temperature: 0.0
random_seed: 42


# Pricing policy reference: https://bailian.console.aliyun.com/cn-beijing/?spm=5176.12818093.resourceCenter.5.3be92cc9JrmbLU&tab=doc#/doc/?type=model&url=2840914

REMOTE_MODELS:
  Text:
    # qwen3.6-plus only (user ruling 11-17): [0] COD gateway, [1] dashscope fallback
    - model: openai/qwen3.6-plus
      api_key: COD_API_KEY
      api_base: COD_MODEL_BASE_URL
      mode: TOOLS
      input_cost: 0.28  # USD (2 CNY) / 1M tokens
      output_cost: 1.68  # USD (12 CNY) / 1M tokens
      output_cost_thinking: 1.68  # = output_cost (thinking off client-side)
    - model: dashscope/qwen3.6-plus  # fallback
      api_key: DASHSCOPE_API_KEY
      api_base: DASHSCOPE_ENDPOINT
      mode: TOOLS
      input_cost: 0.28
      output_cost: 1.68
      output_cost_thinking: 1.68
  Image:
    # remote Image calls are text-only prompts (no VL payload); image annotation goes LOCAL
    - model: openai/qwen3.6-plus
      api_key: COD_API_KEY
      api_base: COD_MODEL_BASE_URL
      mode: TOOLS
      input_cost: 0.28  # USD (2 CNY) / 1M tokens
      output_cost: 1.68  # USD (12 CNY) / 1M tokens
      output_cost_thinking: 1.68  # = output_cost (thinking off client-side)
    - model: dashscope/qwen3.6-plus  # fallback
      api_key: DASHSCOPE_API_KEY
      api_base: DASHSCOPE_ENDPOINT
      mode: TOOLS
      input_cost: 0.28
      output_cost: 1.68
      output_cost_thinking: 1.68
  Audio:
    - model: dashscope/qwen3.8-omni-flash
      api_key: COD_AUDIO_API_KEY
      api_base: COD_AUDIO_MODEL_BASE_URL
      mode: TOOLS
      input_cost: 0.11  # USD / 1M tokens
      output_cost: 0.38  # USD / 1M tokens
      output_cost_thinking: 0.38  # = output_cost

